# 批量重签 termux 系 APK（主程序 + 官方插件），发布为本仓库的 GitHub Release。
# 原理、目标表与本地用法见 README.md 与 docs/。
#
# 触发:
#   - workflow_dispatch: 手动触发，可限定目标仓库、可强制重建同名 release
#   - schedule: 每周检查一次上游新版本，已发布过的版本直接跳过（连下载都省）
#
# 无需配置任何 Secrets：签名密钥是 Emacs 官方公开的（assets/emacs.keystore），
# 发布使用内置 GITHUB_TOKEN。

name: Resign Termux APKs

on:
  workflow_dispatch:
    inputs:
      only:
        description: "只处理指定仓库（逗号分隔，如 termux-api,termux-widget；留空=全部）"
        required: false
        default: ""
      force:
        description: "目标 release 已存在时强制删除重建"
        type: boolean
        required: false
        default: false
  schedule:
    # 每周日 UTC 18:30（北京时间周一 02:30）检查；上游预览版更新不快，无需每天跑。
    # 已发布过的版本直接跳过（先解析版本、已发布就不下载）。无需自动时删除这两行
    - cron: "30 18 * * 0"

permissions:
  contents: write

concurrency:
  group: resign-apks
  cancel-in-progress: false

jobs:
  resign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          # setup-android 的默认 packages 是 "tools platform-tools"，其中 "tools" 是
          # Google 已从 SDK 仓库下线的旧 SDK Tools 包。装它会直接失败：
          #   Warning: Failed to find package 'tools'   → sdkmanager exit 1
          # 所以这里显式指定实际需要的包：platform-tools + 提供 apksigner 的 build-tools。
          # action 在 Linux 上把包名原样作为 argv 传给 sdkmanager（不过 shell），
          # 因此 "build-tools;34.0.0" 里的分号不会被拆成两条命令。
          packages: platform-tools build-tools;34.0.0

      - name: 校验 apksigner 可用
        run: |
          jar=$(ls -d "$ANDROID_HOME"/build-tools/*/lib/apksigner.jar | sort -V | tail -1)
          echo "apksigner: $jar"
          java -jar "$jar" version
          # 把 build-tools 加入 PATH，便于直接调用 apksigner 命令
          for d in "$ANDROID_HOME"/build-tools/*/; do echo "${d%/}" >>"$GITHUB_PATH"; done

      - name: 批量重签并发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--publish)
          if [[ "${{ inputs.force }}" == "true" ]]; then args+=(--force); fi
          if [[ -n "${{ inputs.only }}" ]]; then args+=(--only "${{ inputs.only }}"); fi
          scripts/build-apks.sh "${args[@]}"
